# Producción (VM Debian en Proxmox)
#   cp .env.prod.example .env.prod   # y cambia los secretos
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: home-calendar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?falta DB_NAME}
      MYSQL_USER: ${DB_USER:?falta DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 640m
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    image: home-calendar-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_TZ: ${APP_TZ:-America/Bogota}
      TZ: ${APP_TZ:-America/Bogota}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?falta ADMIN_PASSWORD}
      DISPLAY_NAME: ${DISPLAY_NAME:-Pantalla}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    image: home-calendar-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging

volumes:
  db_data:
  uploads:
