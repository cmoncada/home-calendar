; Firmware de la pantalla de Home Calendar para la "Cheap Yellow Display"
; (ESP32-2432S028R: ILI9341 320x240 + táctil XPT2046).
;
;   pio run -e cyd -t upload        compilar y subir a la placa
;   pio device monitor -e cyd       ver los logs por USB
;   pio run -e cyd-mock -t upload   placa con datos de ejemplo (sin WiFi ni servidor)
;   pio run -e wokwi                compilar para el simulador Wokwi (VS Code)
;   pio test -e native              tests de lib/agenda en el Mac

[platformio]
default_envs = cyd

; ---------- Común a todos los entornos con ESP32 ----------
[esp32_base]
platform = espressif32@6.13.0     ; Arduino core 2.0.17 (el más estable con TFT_eSPI)
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = min_spiffs.csv   ; más espacio para el programa (WiFiManager + fuentes)
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  ; --- TFT_eSPI configurado aquí (no hace falta editar User_Setup.h de la librería) ---
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
build_unflags = -std=gnu++11

; ---------- Placa real ----------
[env:cyd]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DILI9341_2_DRIVER=1

; Placa real con datos de ejemplo: sirve para ajustar el diseño sin WiFi ni servidor
[env:cyd-mock]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -DMOCK_DATA=1

; ---------- Simulador Wokwi (VS Code) ----------
; Sin táctil (Wokwi no tiene XPT2046): usa 3 pulsadores. WiFi "Wokwi-GUEST" sin portal.
; Con include/sim_config.h (ver sim_config.example.h) pide los datos reales al backend del Mac;
; sin él, usa los datos de ejemplo.
[env:wokwi]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -DILI9341_DRIVER=1
  -DSIMULATOR=1
  -DSIM_BUTTONS=1

; ---------- Tests de la lógica pura en el Mac ----------
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_compat_mode = off
build_flags = -std=c++17
