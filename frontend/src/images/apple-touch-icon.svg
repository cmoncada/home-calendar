  <!-- Grupo centrado con safe zone (escalado a 3.4x para encajar perfectamente con margen de seguridad) -->
  <g transform="translate(35.6, 35.6) scale(3.4)">
    <!-- Silueta de la casa en azul marino profundo -->
    <path d="M16 2.8L2.5 13.5C2 13.9 2 14.7 2.5 15.1C3 15.5 3.8 15.5 4.2 15L5 14.3V26C5 27.7 6.3 29 8 29H24C25.7 29 27 27.7 27 26V14.3L27.8 15C28.2 15.5 29 15.5 29.5 15.1C30 14.7 30 13.9 29.5 13.5L24 9.1V4.5C24 3.9 23.6 3.5 23 3.5H20.5C19.9 3.5 19.5 3.9 19.5 4.5V5.5L16 2.8Z" fill="#0B1B3D"/>

    <!-- Retícula de días -->
    <!-- Fila superior -->
    <rect x="8.5" y="15" width="3.5" height="3.5" rx="1" fill="#94A3B8"/>
    <rect x="14.25" y="15" width="3.5" height="3.5" rx="1" fill="#94A3B8"/>
    <rect x="20" y="15" width="3.5" height="3.5" rx="1" fill="#94A3B8"/>

    <!-- Fila inferior -->
    <rect x="8.5" y="20.5" width="3.5" height="3.5" rx="1" fill="#94A3B8"/>
    <rect x="14.25" y="20.5" width="3.5" height="3.5" rx="1" fill="#94A3B8"/>

    <!-- Día activo en azul iOS -->
    <rect x="20" y="20.5" width="3.5" height="3.5" rx="1" fill="#007AFF"/>
  </g>
</svg>
