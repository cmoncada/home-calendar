<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Home Calendar</title>
    <script>
      // Aplica el tema guardado antes de pintar la página (evita un destello del tema equivocado)
      try {
        if (localStorage.getItem('hc.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f4f4f1';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
