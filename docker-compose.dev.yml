# Entorno de desarrollo / pruebas local (Mac)
#   docker compose -f docker-compose.dev.yml up --build
#   App:      http://localhost:5173
#   API:      http://localhost:3000/api/health
#   Adminer:  docker compose -f docker-compose.dev.yml --profile tools up   → http://localhost:8080
name: home-calendar-dev

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-home_calendar}
      MYSQL_USER: ${DB_USER:-home}
      MYSQL_PASSWORD: ${DB_PASSWORD:-home_dev_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_dev:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev_pass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      APP_TZ: ${APP_TZ:-America/Bogota}
      TZ: ${APP_TZ:-America/Bogota}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-home_calendar}
      DB_USER: ${DB_USER:-home}
      DB_PASSWORD: ${DB_PASSWORD:-home_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      DISPLAY_NAME: ${DISPLAY_NAME:-Pantalla}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      UPLOADS_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/migrations:/app/backend/migrations
      - ./backend/public:/app/backend/public
      - ./backend/tests:/app/backend/tests
      - uploads_dev:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      VITE_API_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.js:/app/frontend/vite.config.js
    depends_on:
      - backend

  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db_dev:
  uploads_dev:
